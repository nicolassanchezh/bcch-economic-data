name: Scheduled DB Update

on:
  schedule:
    # Domingos a las 12:00 UTC (09:00 hora Chile en horario de invierno)
    - cron: "0 12 * * 0"
  workflow_dispatch:  # permite gatillarlo a mano desde la UI de GitHub

permissions:
  contents: write  # necesario para hacer git push de vuelta

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update database
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASSWORD: ${{ secrets.BCCH_PASSWORD }}
        run: python scripts/update_db.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bcch.db
          if git diff --staged --quiet; then
            echo "Sin cambios en bcch.db, no se commitea."
          else
            git commit -m "chore: actualización automática BCCh DB ($(date +%Y-%m-%d))"
            git push
          fi